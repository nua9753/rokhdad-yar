# با هر تگ v* (مثلاً v2.14.0): بستهٔ نصبی rokhdadyar.zip ساخته و به یک Release تازه ضمیمه می‌شود.
# سایت‌ها از همین Release به‌روزرسانی را در پیشخوان وردپرس می‌بینند.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 -E '^\s*\*\s*Version:' rokhdadyar.php | sed -E 's/.*Version:\s*//; s/\s+$//')
          echo "tag=$TAG header=$VER"
          if [ "$TAG" != "$VER" ]; then echo "::error::Version in rokhdadyar.php ($VER) does not match tag ($TAG)"; exit 1; fi

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build package
        run: |
          mkdir -p build/rokhdadyar
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude '.gitignore' --exclude '.gitattributes' --exclude 'README.md' ./ build/rokhdadyar/
          cd build && zip -qr rokhdadyar.zip rokhdadyar

      - name: Release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^= "v" =" {f=1; next} /^= / {f=0} f' readme.txt > notes.md
          [ -s notes.md ] || echo "نسخهٔ $VER" > notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: رخدادیار ${{ github.ref_name }}
          body_path: notes.md
          files: build/rokhdadyar.zip
